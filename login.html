<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Log in - FlowDay Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #FAF8F6;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #1F1625;
        }

        body::before {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 138, 200, 0.25) 0%, rgba(139, 92, 246, 0.12) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            top: -10%;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            width: 100%;
            height: 100%;
            max-width: 430px;
            padding: 50px 28px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 40px 80px rgba(139, 92, 246, 0.05);
            animation: appAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes appAppear {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .header-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-small {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #FF8AC8 0%, #8B5CF6 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.2);
        }

        h2 {
            color: #1E1B4B;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtext {
            color: #6B7280;
            font-size: 14px;
            font-weight: 500;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
            transition: transform 0.3s ease;
            filter: grayscale(1) opacity(0.6);
        }

        .input-field {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border: 1px solid #E5E7EB;
            border-radius: 16px;
            background: #FFFFFF;
            font-size: 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: all 0.25s ease;
            color: #1E1B4B;
        }

        .input-field::placeholder {
            color: #9CA3AF;
        }

        .input-field:focus {
            border-color: #8B5CF6;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.08);
        }

        .input-field:focus + .input-icon {
            transform: translateY(-50%) scale(1.1);
            filter: grayscale(0) opacity(1);
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 4px 24px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6B7280;
            cursor: pointer;
            font-weight: 500;
        }

        .remember input[type="checkbox"] {
            accent-color: #8B5CF6;
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .next-btn {
            width: 100%;
            background: linear-gradient(135deg, #FF8AC8 0%, #8B5CF6 100%);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 54px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.15);
        }

        .next-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            color: #EF4444;
            background: #FEF2F2;
            border: 1px solid #FEE2E2;
            padding: 12px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            text-align: center;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-section">
            <div class="logo-small">FD</div>
            <h2>Welcome back</h2>
            <p class="subtext">Log in to continue your journey</p>
        </div>
        
        <div class="form-container">
            <div class="input-group" style="margin-bottom: 14px;">
                <input type="text" class="input-field" id="username" placeholder="Username" required>
                <span class="input-icon">👤</span>
            </div>

            <div class="input-group" style="margin-bottom: 14px;">
                <input type="number" class="input-field" id="age" placeholder="Age" min="10" max="100" required>
                <span class="input-icon">🎂</span>
            </div>

            <div class="input-group" style="margin-bottom: 14px;">
                <input type="email" class="input-field" id="email" placeholder="Email Address" required>
                <span class="input-icon">✉️</span>
            </div>

            <div class="input-group">
                <input type="password" class="input-field" id="password" placeholder="Password" required>
                <span class="input-icon">🔒</span>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox" id="rememberMe"> Remember me
            </label>
        </div>
        
        <button class="next-btn" id="loginBtn">
            <span class="btn-text" id="btnText">Sign In / Sign Up</span>
            <div class="loader" id="loader"></div>
        </button>

        <p class="error-msg" id="errorMsg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyB1gI-OSbGCGPIMA5NCnuB2K_-IyrMWFHs",
          authDomain: "flowday-81f42.firebaseapp.com",
          projectId: "flowday-81f42",
          storageBucket: "flowday-81f42.firebasestorage.app",
          messagingSenderId: "854763403133",
          appId: "1:854763403133:web:13f5eafb11422d89787e14",
          measurementId: "G-W5Q0QYEGEG"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        function loadSavedCredentials() {
            const savedData = JSON.parse(localStorage.getItem('rememberedUser'));
            if (savedData) {
                document.getElementById('username').value = savedData.username || '';
                document.getElementById('age').value = savedData.age || '';
                document.getElementById('email').value = savedData.email || '';
                document.getElementById('rememberMe').checked = true;
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const age = document.getElementById('age').value;
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');

            if(!username || !age || !email || !password) {
                showError("Please fill all fields");
                return;
            }

            btnText.style.display = 'none';
            loader.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                let userCredential;
                
                try {
                    // 1. محاولة تسجيل الدخول العادي مباشرة
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                } catch (authError) {
                    // 2. إذا لم يكن الإيميل مسجل من قبل، نقوم بإنشاء الحساب فوراً تلقائياً
                    if (authError.code === 'auth/user-not-found' || authError.code === 'auth/invalid-credential' && !authError.message.includes("password")) {
                        userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    } 
                    // 3. إذا كان الباسورد خاطئ للحساب المسجل
                    else if (authError.code === 'auth/wrong-password' || authError.message.includes("password") || authError.code === 'auth/invalid-credential') {
                        throw new Error("Incorrect password for this account.");
                    } else {
                        throw authError;
                    }
                }

                // حفظ البيانات محلياً
                if (document.getElementById('rememberMe').checked) {
                    const userData = { username, age, email };
                    localStorage.setItem('rememberedUser', JSON.stringify(userData));
                } else {
                    localStorage.removeItem('rememberedUser');
                }

                localStorage.setItem('profile_saved_name', username);
                localStorage.setItem('profile_saved_email', email);
                localStorage.setItem('profile_saved_age', age);

                // الانتقال الفوري والمباشر دون تعليق
                window.location.href = "bag2.html";

            } catch (firebaseError) {
                showError(firebaseError.message);
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        });

        window.addEventListener('DOMContentLoaded', loadSavedCredentials);
    </script>
</body>
</html>
