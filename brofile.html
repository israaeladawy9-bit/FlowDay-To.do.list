let appLang = 'en';
// استخدام معرف مستخدم ثابت كمثال (في التطبيقات الحقيقية يفضل استخدام الـ User ID الخاص بـ Firebase Auth)
const userId = "current_user_id"; 

document.addEventListener("DOMContentLoaded", () => {
    appLang = localStorage.getItem('flowday_app_lang') || 'en';
    applyTranslations(appLang);

    const savedTheme = localStorage.getItem('flowday_theme') || 'light';
    applyTheme(savedTheme);

    // ننتظر قليلاً للتأكد من تحميل مكتبات Firebase أولاً
    setTimeout(() => {
        loadProfileAndAvatarData();
    }, 500);

    document.getElementById('saveProfileBtn').addEventListener('click', saveAndBroadcastProfile);
    
    document.getElementById('inputName').addEventListener('input', (e) => {
        const fallback = profileDictionary[appLang]?.default_user || 'User';
        document.getElementById('previewName').innerText = e.target.value.trim() || fallback;
    });
    document.getElementById('inputPurpose').addEventListener('change', (e) => {
        const selectedOption = e.target.options[e.target.selectedIndex];
        document.getElementById('previewPurpose').innerText = selectedOption.text;
    });
});

function applyTranslations(lang) {
    if (lang === 'ar') {
        document.body.classList.add('rtl');
        document.getElementById('arrowDropdown').style.left = '16px';
        document.getElementById('arrowDropdown').style.right = 'auto';
    } else {
        document.body.classList.remove('rtl');
        document.getElementById('arrowDropdown').style.left = 'auto';
        document.getElementById('arrowDropdown').style.right = '16px';
    }

    document.querySelectorAll('[data-key]').forEach(element => {
        const key = element.getAttribute('data-key');
        if (profileDictionary[lang] && profileDictionary[lang][key]) {
            if (element.tagName === 'OPTION') {
                element.text = profileDictionary[lang][key];
            } else {
                element.innerText = profileDictionary[lang][key];
            }
        }
    });
}

function applyTheme(theme) {
    document.body.className = ''; 
    if (appLang === 'ar') document.body.classList.add('rtl');
    if (theme !== 'light') {
        document.body.classList.add('theme-' + theme);
    }
}

// تعديل الدالة لجلب البيانات من Firestore
async function loadProfileAndAvatarData() {
    const savedAvatarHTML = localStorage.getItem('customVectorAvatar');
    const targetLayerBox = document.getElementById('avatarTargetContainer');
    if (savedAvatarHTML) {
        targetLayerBox.innerHTML = savedAvatarHTML;
    } else {
        targetLayerBox.innerHTML = `<div class="layer" style="color: var(--main-purple); font-size: 60px;"><i class="fa-solid fa-circle-user"></i></div>`;
    }

    const defaultUserName = profileDictionary[appLang]?.default_user || 'User';

    try {
        // جلب مستند المستخدم من مجموعة "users" في Firestore
        const docRef = window.doc(window.db, "users", userId);
        const docSnap = await window.getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            
            document.getElementById('inputName').value = data.username || defaultUserName;
            document.getElementById('inputEmail').value = data.email || '';
            document.getElementById('inputPurpose').value = data.purpose || 'Your artistic space';
            document.getElementById('inputAge').value = data.age || '';
        } else {
            // في حال عدم وجود بيانات مسبقة في السيرفر نضع الافتراضية
            document.getElementById('inputName').value = defaultUserName;
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputPurpose').value = 'Your artistic space';
            document.getElementById('inputAge').value = '';
        }

        document.getElementById('previewName').innerText = document.getElementById('inputName').value;
        const selectEl = document.getElementById('inputPurpose');
        const currentOpt = selectEl.options[selectEl.selectedIndex];
        document.getElementById('previewPurpose').innerText = currentOpt ? currentOpt.text : 'Your artistic space';

    } catch (error) {
        console.error("Error loading profile from Firestore: ", error);
    }
}

// تعديل الدالة لحفظ البيانات في Firestore
async function saveAndBroadcastProfile() {
    const defaultUserName = profileDictionary[appLang]?.default_user || 'User';
    const finalName = document.getElementById('inputName').value.trim() || defaultUserName;
    const finalEmail = document.getElementById('inputEmail').value.trim();
    const finalPurpose = document.getElementById('inputPurpose').value;
    const finalAge = document.getElementById('inputAge').value.trim();

    try {
        // حفظ الكائن داخل مستند المستخدم في Firestore
        await window.setDoc(window.doc(window.db, "users", userId), {
            username: finalName,
            email: finalEmail,
            purpose: finalPurpose,
            age: finalAge,
            updatedAt: new Date()
        }, { merge: true });

        // إظهار رسالة النجاح والتوجه للملف الرئيسي
        document.getElementById('successNotification').style.display = 'flex';
        setTimeout(() => {
            window.location.href = 'main.html';
        }, 1000);

    } catch (error) {
        console.error("Error saving profile to Firestore: ", error);
        alert("حدث خطأ أثناء حفظ البيانات، يرجى التحقق من إعدادات قواعد البيانات (Rules) في Firestore.");
    }
}
