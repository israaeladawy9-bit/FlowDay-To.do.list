<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AuraNotes Mobile Pro ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>
:root {
  --bg-main: #FAF8FC;
  --panel-glass: rgba(255, 255, 255, 0.85);
  --border-glass: rgba(243, 230, 255, 0.9);
  --primary-glow: linear-gradient(135deg, #A855F7 0%, #EC4899 100%);
  --text-primary: #1E1B4B;
  --text-muted: #78716C;
  --accent-purple: #A855F7;
  --accent-pink: #EC4899;
  --star-gold: #FBBF24;
  --shadow-sm: 0 4px 20px rgba(168, 85, 247, 0.04);
  --shadow-lg: 0 20px 40px rgba(168, 85, 247, 0.08);
  --card-surf: #FFFFFF;
}

body.theme-dark {
  --bg-main: #0C0A12;
  --panel-glass: rgba(24, 18, 36, 0.85);
  --border-glass: rgba(168, 85, 247, 0.15);
  --text-primary: #F3E8FF;
  --text-muted: #A78BFA;
  --card-surf: #161124;
  --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
}
body.theme-pink {
  --bg-main: #FFF1F2;
  --panel-glass: rgba(255, 255, 255, 0.85);
  --border-glass: #FFE4E6;
  --text-primary: #4C0519;
  --text-muted: #9F1239;
  --card-surf: #FFFFFF;
}
body.theme-purple {
  --bg-main: #FAF5FF;
  --panel-glass: rgba(255, 255, 255, 0.85);
  --border-glass: #F3E8FF;
  --text-primary: #3B0764;
  --text-muted: #701A75;
  --card-surf: #FFFFFF;
}
body.theme-green {
  --bg-main: #F0FDF4;
  --panel-glass: rgba(255, 255, 255, 0.85);
  --border-glass: #DCFCE7;
  --text-primary: #14532D;
  --text-muted: #16A34A;
  --card-surf: #FFFFFF;
}
body.theme-blue {
  --bg-main: #F0F9FF;
  --panel-glass: rgba(255, 255, 255, 0.85);
  --border-glass: #E0F2FE;
  --text-primary: #0C4A6E;
  --text-muted: #0284C7;
  --card-surf: #FFFFFF;
}
body.theme-gold {
  --bg-main: #FEFCE8;
  --panel-glass: rgba(255, 255, 255, 0.85);
  --border-glass: #FEF9C3;
  --text-primary: #713F12;
  --text-muted: #CA8A04;
  --card-surf: #FFFFFF;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Outfit', 'Cairo', sans-serif;
  background: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}

body.rtl { direction: rtl; }

.glow-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.glow-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.25; animation: floatAround 20s infinite alternate ease-in-out; }
.orb-purple { width: 300px; height: 300px; top: -5%; left: -10%; background: #C084FC; }
.orb-pink { width: 280px; height: 280px; bottom: 10%; right: -10%; background: #F472B6; animation-delay: -5s; }

@keyframes floatAround { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 20px) scale(1.1); } }

.app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px 16px 100px; position: relative; z-index: 1; }

header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
  background: var(--panel-glass); padding: 12px 16px; border-radius: 18px;
  border: 1.5px solid var(--border-glass); box-shadow: var(--shadow-sm);
}
.menu-toggle-btn { background: transparent; border: none; font-size: 26px; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; }
.brand-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; background: var(--primary-glow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.back-dash-btn { color: var(--text-muted); font-size: 24px; text-decoration: none; display: flex; align-items: center; transition: color 0.2s; }
.back-dash-btn:hover { color: var(--accent-purple); }

.sidebar-overlay { position: fixed; inset: 0; background: rgba(30, 27, 75, 0.4); backdrop-filter: blur(4px); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.sidebar-overlay.active { opacity: 1; pointer-events: all; }
.sidebar { position: fixed; top: 0; bottom: 0; width: 290px; background: var(--card-surf); z-index: 2001; box-shadow: 20px 0 40px rgba(0,0,0,0.05); padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; transition: left 0.3s ease, right 0.3s ease; overflow-y: auto; }
body:not(.rtl) .sidebar { left: -290px; }
body.rtl .sidebar { right: -290px; }
body:not(.rtl) .sidebar-overlay.active .sidebar { left: 0; }
body.rtl .sidebar-overlay.active .sidebar { right: 0; }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(168, 85, 247, 0.1); padding-bottom: 14px; }
.sidebar-brand { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; }
.panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 8px; margin-top: 8px; }
.nav-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; transition: all 0.2s; }
.nav-item .nav-left { display: flex; align-items: center; gap: 10px; }
.nav-item i.main-icon { font-size: 18px; color: var(--accent-purple); }
.nav-item:hover, .nav-item.active { background: var(--primary-glow); color: white; }
.nav-item:hover i.main-icon, .nav-item.active i.main-icon { color: white; }

.remove-folder-btn { background: transparent; border: none; color: #EF4444; opacity: 0; transition: opacity 0.2s; cursor: pointer; display: flex; align-items: center; }
.nav-item:hover .remove-folder-btn { opacity: 1; }
.nav-item.active .remove-folder-btn { color: white; opacity: 1; }

.folders-scroll-zone { max-height: 140px; overflow-y: auto; }
.add-folder-box { display: flex; gap: 8px; margin-top: 8px; background: rgba(168, 85, 247, 0.05); padding: 4px; border-radius: 12px; border: 1px dashed var(--accent-purple); }
.folder-input { flex: 1; border: none; background: transparent; padding: 6px 10px; font-family: inherit; font-size: 13px; outline: none; color: var(--text-primary); }
.btn-square { background: var(--primary-glow); border: none; color: white; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
.theme-dot { width: 100%; height: 34px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
.theme-dot.active { border-color: var(--text-primary) !important; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

.lang-select-box { background: var(--card-surf); border: 1.5px solid var(--border-glass); border-radius: 14px; padding: 10px 14px; font-family: inherit; font-size: 14px; color: var(--text-primary); width: 100%; outline: none; cursor: pointer; margin-top: 6px; }

.main-content { display: flex; flex-direction: column; gap: 20px; }
.editor-core { background: var(--panel-glass); border: 1.5px solid var(--border-glass); backdrop-filter: blur(20px); border-radius: 24px; padding: 18px; box-shadow: var(--shadow-lg); }
.editor-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.editor-options-group { display: flex; align-items: center; gap: 8px; }

.folder-selector-wrapper { position: relative; display: inline-block; }
.folder-selector { appearance: none; -webkit-appearance: none; background: var(--card-surf); border: 1.5px solid var(--border-glass); padding: 8px 32px 8px 12px; border-radius: 12px; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--text-primary); outline: none; cursor: pointer; }
body.rtl .folder-selector { padding: 8px 12px 8px 32px; }
.folder-selector-wrapper::after { content: '\ebad'; font-family: 'boxicons'; position: absolute; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--accent-purple); pointer-events: none; }
body:not(.rtl) .folder-selector-wrapper::after { right: 12px; }
body.rtl .folder-selector-wrapper::after { left: 12px; }

.secret-toggle-btn { background: var(--card-surf); border: 1.5px solid var(--border-glass); padding: 8px; border-radius: 12px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.secret-toggle-btn.active { background: #EF4444; color: white; border-color: #EF4444; }

.editor-title { width: 100%; border: none; outline: none; background: transparent; font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--text-primary); padding-bottom: 10px; border-bottom: 1px solid rgba(168, 85, 247, 0.1); margin-bottom: 14px; }
.editor-content { width: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: var(--text-primary); line-height: 1.7; min-height: 110px; resize: none; }
.editor-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(168, 85, 247, 0.1); }
.meta-info { font-size: 11px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }

.action-btn { background: var(--primary-glow); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2); }
.action-btn.danger-btn { background: #EF4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }

.controls-row { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.section-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--text-primary); }
.search-box { position: relative; width: 100%; }
.search-box i { position: absolute; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
body:not(.rtl) .search-box i { left: 14px; }
body.rtl .search-box i { right: 14px; }
.search-input { background: var(--panel-glass); border: 1.5px solid var(--border-glass); border-radius: 14px; outline: none; font-family: inherit; font-size: 14px; width: 100%; color: var(--text-primary); box-shadow: var(--shadow-sm); padding: 10px 16px; }
body:not(.rtl) .search-input { padding-left: 40px; }
body.rtl .search-input { padding-right: 40px; }

.notes-grid { display: flex; flex-direction: column; gap: 14px; }
.note-card { background: var(--panel-glass); border: 1.5px solid var(--border-glass); backdrop-filter: blur(16px); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.note-card.favorite-style { background: linear-gradient(to right, rgba(251, 191, 36, 0.03), var(--panel-glass)); box-shadow: 0 10px 25px rgba(251, 191, 36, 0.05); }
body:not(.rtl) .note-card.favorite-style { border-left: 4px solid var(--star-gold); }
body.rtl .note-card.favorite-style { border-right: 4px solid var(--star-gold); }
.note-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.note-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
.star-btn { background: transparent; border: none; cursor: pointer; font-size: 24px; color: #D1D5DB; }
.star-btn.active { color: var(--star-gold); }
.note-body { font-size: 13.5px; color: var(--text-primary); opacity: 0.85; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.note-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(168, 85, 247, 0.08); }
.folder-badge { background: rgba(168, 85, 247, 0.08); color: var(--accent-purple); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; }
.folder-badge.secret-badge { background: rgba(239, 68, 68, 0.1); color: #EF4444; }
.card-actions { display: flex; gap: 6px; align-items: center; }
.card-icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border-glass); background: var(--card-surf); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.card-icon-btn.delete:hover { color: #EF4444; background: #FEF2F2; }

.overlay { position: fixed; inset: 0; background: rgba(30, 27, 75, 0.4); backdrop-filter: blur(6px); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.overlay.active { opacity: 1; pointer-events: all; }
.modal-box { background: var(--card-surf); border-radius: 24px; padding: 20px; width: 100%; max-width: 400px; border: 1.5px solid var(--border-glass); }

.pin-display { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent-purple); transition: background 0.2s; }
.pin-dot.filled { background: var(--accent-purple); }
.pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 240px; margin: 0 auto; }
.pin-btn { background: var(--panel-glass); border: 1.5px solid var(--border-glass); border-radius: 50%; width: 54px; height: 54px; font-size: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto; color: var(--text-primary); }

.toast-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-primary); color: var(--bg-main); padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-lg); transition: transform 0.3s ease; z-index: 10000; }
.toast-bar.active { transform: translateX(-50%) translateY(0); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }

.back-to-top { position: fixed; bottom: 30px; width: 46px; height: 46px; background: var(--primary-glow); color: white; border: none; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 24px rgba(168, 85, 247, 0.2); z-index: 99; opacity: 0; visibility: hidden; transition: all 0.4s ease; }
body:not(.rtl) .back-to-top { right: 20px; }
body.rtl .back-to-top { left: 20px; }
.back-to-top.show { opacity: 1; visibility: visible; }
</style>
</head>
<body>

<button id="backToTopBtn" class="back-to-top"><i class='bx bx-up-arrow-alt'></i></button>

<div class="glow-bg">
  <div class="glow-orb orb-purple"></div>
  <div class="glow-orb orb-pink"></div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)">
  <div class="sidebar" onclick="event.stopPropagation()">
    <div class="sidebar-header">
      <span class="sidebar-brand" id="sbBrand">AuraNotes Space</span>
      <button class="menu-toggle-btn" onclick="toggleSidebar(false)"><i class='bx bx-x'></i></button>
    </div>
    
    <div>
      <div class="panel-title" id="sbViewsTitle">Views</div>
      <div class="nav-item active" id="viewAll" onclick="switchView('all')">
        <div class="nav-left"><i class='bx bx-grid-alt main-icon'></i><span id="sbAllNotes">All Notes</span></div>
      </div>
      <div class="nav-item" id="viewSecret" onclick="switchView('secret')">
        <div class="nav-left"><i class='bx bx-lock-alt main-icon' style="color:#EF4444"></i><span id="sbSecretNotes">Secret Notes</span></div>
      </div>
      <div class="nav-item" id="viewFav" onclick="switchView('fav')">
        <div class="nav-left"><i class='bx bxs-star main-icon' style="color:var(--star-gold)"></i><span id="sbFavs">Favorites</span></div>
      </div>
      <div class="nav-item" id="viewTrash" onclick="switchView('trash')">
        <div class="nav-left"><i class='bx bx-trash main-icon' style="color:#78716C"></i><span id="sbTrashBin">Trash Bin</span></div>
      </div>
    </div>

    <div>
      <div class="panel-title" id="sbFoldersTitle">Folders Management</div>
      <div id="foldersContainer" class="folders-scroll-zone"></div>
      <div class="add-folder-box">
        <input type="text" id="newFolderInput" class="folder-input">
        <button class="btn-square" onclick="createNewFolder()"><i class='bx bx-plus'></i></button>
      </div>
    </div>

    <div>
      <div class="panel-title" id="sbLangTitle">Language / اللغة</div>
      <select id="langSelect" class="lang-select-box" onchange="changeLanguage(this.value)">
        <option value="en">🇺🇸 English</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="fa">🇮🇷 فارسی</option>
        <option value="ur">🇵🇰 اردو</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="bn">🇧🇩 বাংলা</option>
        <option value="id">🇮🇩 Indonesia</option>
        <option value="ms">🇲🇾 Melayu</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="th">🇹🇭 ไทย</option>
        <option value="nl">🇳🇱 Nederlands</option>
        <option value="pt">🇵🇹 Português</option>
      </select>
    </div>

    <div>
      <div class="panel-title" id="sbThemeTitle">Select Aura Theme</div>
      <div class="theme-grid">
        <div class="theme-dot active" data-theme="light" style="background:#FAF8FC; border:1px solid #ddd;" onclick="setTheme('light')"></div>
        <div class="theme-dot" data-theme="dark" style="background:#0C0A12;" onclick="setTheme('dark')"></div>
        <div class="theme-dot" data-theme="pink" style="background:#FFF1F2;" onclick="setTheme('pink')"></div>
        <div class="theme-dot" data-theme="purple" style="background:#FAF5FF;" onclick="setTheme('purple')"></div>
        <div class="theme-dot" data-theme="green" style="background:#F0FDF4;" onclick="setTheme('green')"></div>
        <div class="theme-dot" data-theme="blue" style="background:#F0F9FF;" onclick="setTheme('blue')"></div>
        <div class="theme-dot" data-theme="gold" style="background:#FEFCE8;" onclick="setTheme('gold')"></div>
      </div>
    </div>
  </div>
</div>

<div class="app-container">
  <header class="animate__animated animate__fadeInDown">
    <button class="menu-toggle-btn" onclick="toggleSidebar(true)"><i class='bx bx-menu-alt-left'></i></button>
    <h1 class="brand-title" id="mainHeaderTitle">My Notes ✨</h1>
    <a href="main.html" class="back-dash-btn"><i class='bx bx-home-smile'></i></a>
  </header>

  <div class="main-content animate__animated animate__fadeInUp">
    
    <div class="editor-core" id="mainEditorBox">
      <div class="editor-top-bar">
        <span class="meta-info"><i class='bx bx-edit-alt'></i> <span id="lblCompose">Compose Ideas</span></span>
        <div class="editor-options-group">
          <button class="secret-toggle-btn" id="secretToggleBtn" onclick="toggleSecretMode()" title="Secure Note">
            <i class='bx bx-lock-alt'></i>
          </button>
          <div class="folder-selector-wrapper">
            <select id="noteFolderSelect" class="folder-selector"></select>
          </div>
        </div>
      </div>
      <input type="text" id="noteTitle" class="editor-title">
      <textarea id="noteContent" class="editor-content"></textarea>
      <div class="editor-footer">
        <span class="meta-info" id="charCount">0 characters</span>
        <button class="action-btn" onclick="addNote()">
          <i class='bx bx-folder-plus'></i> <span id="btnSave">Save Log</span>
        </button>
      </div>
    </div>

    <div class="controls-row">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 class="section-title" id="currentViewTitle">All Notes</h2>
        <button class="action-btn danger-btn" id="emptyTrashBtn" style="display:none; padding:6px 12px; font-size:11px;" onclick="emptyTrashAll()">Empty Trash</button>
      </div>
      <div class="search-box">
        <i class='bx bx-search'></i>
        <input type="text" id="searchInput" class="search-input" oninput="renderNotes()">
      </div>
    </div>

    <div class="notes-grid" id="notesGrid"></div>
  </div>
</div>

<div class="overlay" id="editModal">
  <div class="modal-box animate__animated animate__zoomIn animate__fast">
    <div class="editor-top-bar">
      <span class="section-title" id="lblModify">Modify Note</span>
      <div class="folder-selector-wrapper">
        <select id="editFolderSelect" class="folder-selector"></select>
      </div>
    </div>
    <input type="text" id="editTitle" class="editor-title" style="margin-top:12px">
    <textarea id="editContent" class="editor-content" style="min-height:140px"></textarea>
    <div class="editor-footer">
      <button class="card-icon-btn" onclick="closeModal()"><i class='bx bx-x'></i></button>
      <button class="action-btn" onclick="saveEdit()" id="btnApply">Apply Changes</button>
    </div>
  </div>
</div>

<div class="overlay" id="pinModal">
  <div class="modal-box animate__animated animate__zoomIn animate__fast" style="max-width:320px; text-align:center;">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1gI-OSbGCGPIMA5NCnuB2K_-IyrMWFHs",
  authDomain: "flowday-81f42.firebaseapp.com",
  projectId: "flowday-81f42",
  storageBucket: "flowday-81f42.firebasestorage.app",
  messagingSenderId: "854763403133",
  appId: "1:854763403133:web:13f5eafb11422d89787e14",
  measurementId: "G-W5Q0QYEGEG"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

// Link Firebase Functions to Global Scope
window.saveToFirebase = async function() {
  try {
    await setDoc(doc(db, "users", "global_user"), {
      notes: window.notes,
      trash: window.trash,
      folders: window.folders,
      customPin: window.customPin
    });
  } catch (error) {
    console.error("Firebase Sync Error: ", error);
  }
};

window.loadFromFirebase = async function() {
  try {
    const docRef = doc(db, "users", "global_user");
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      const data = docSnap.data();
      if(data.notes) window.notes = data.notes;
      if(data.trash) window.trash = data.trash;
      if(data.folders) window.folders = data.folders;
      if(data.customPin) {
        window.customPin = data.customPin;
        localStorage.setItem('auraNotes_custom_pin', window.customPin);
      }
      window.saveState(false); 
      window.renderFolders();
      window.renderNotes();
    }
  } catch (error) {
    console.error("Firebase Load Error: ", error);
  }
};

// Auto fetch data on load
window.addEventListener('DOMContentLoaded', () => {
  window.loadFromFirebase();
});
</script>

window.notes = JSON.parse(localStorage.getItem('auraNotes_data') || '[]');
window.trash = JSON.parse(localStorage.getItem('auraNotes_trash') || '[]');
const protectedFolders = ["Personal", "Work", "Ideas"];
window.folders = JSON.parse(localStorage.getItem('auraNotes_folders') || '["Personal", "Work", "Ideas"]');
let currentView = 'all';
let editingNoteId = null;
let isSecretMode = false;

let currentPinDigits = "";
window.customPin = localStorage.getItem('auraNotes_custom_pin') || ""; 
let pinSetupMode = window.customPin === "" ? "SETUP" : "AUTH"; 
let tempNewPin = "";
let onPinSuccessCallback = null;

const notesGrid = document.getElementById('notesGrid');
const foldersContainer = document.getElementById('foldersContainer');
const noteFolderSelect = document.getElementById('noteFolderSelect');
const editFolderSelect = document.getElementById('editFolderSelect');
const backToTopBtn = document.getElementById('backToTopBtn');

let currentLang = localStorage.getItem('flowday_app_lang') || 'en';
const savedTheme = localStorage.getItem('flowday_theme') || 'light';
let langData = dictionary[currentLang] || dictionary.en;

document.getElementById('langSelect').value = currentLang;
if (currentLang === 'ar' || currentLang === 'fa' || currentLang === 'ur') {
  document.body.classList.add('rtl');
} else {
  document.body.classList.remove('rtl');
}
setTheme(savedTheme);

function changeLanguage(langCode) {
  currentLang = langCode;
  localStorage.setItem('flowday_app_lang', langCode);
  langData = dictionary[langCode] || dictionary.en;
  
  if (langCode === 'ar' || langCode === 'fa' || langCode === 'ur') {
    document.body.classList.add('rtl');
  } else {
    document.body.classList.remove('rtl');
  }
  
  applyLocalization();
  renderFolders();
  renderNotes();
  proceedSwitchView(currentView);
}

function applyLocalization() {
  document.getElementById('mainHeaderTitle').textContent = langData.title;
  document.getElementById('lblCompose').textContent = langData.compose;
  document.getElementById('noteTitle').placeholder = langData.title_ph;
  document.getElementById('noteContent').placeholder = langData.content_ph;
  document.getElementById('btnSave').textContent = langData.save;
  document.getElementById('searchInput').placeholder = langData.search_ph;
  document.getElementById('newFolderInput').placeholder = langData.folder_ph;
  document.getElementById('sbBrand').textContent = langData.sb_brand;
  document.getElementById('sbViewsTitle').textContent = langData.sb_views;
  document.getElementById('sbFoldersTitle').textContent = langData.sb_folders;
  document.getElementById('sbAllNotes').textContent = langData.all_notes;
  document.getElementById('sbFavs').textContent = langData.favs;
  document.getElementById('sbSecretNotes').textContent = langData.secret_notes;
  document.getElementById('sbTrashBin').textContent = langData.trash_bin;
  document.getElementById('sbThemeTitle').textContent = langData.select_theme;
  document.getElementById('lblModify').textContent = langData.modal_title;
  document.getElementById('btnApply').textContent = langData.apply;
  document.getElementById('emptyTrashBtn').textContent = langData.empty_trash_btn;
  document.getElementById('btnResetPin').textContent = langData.change_pin_auth.split(' ')[0] + " PIN";
  updateCharCount(0);
}

function updateCharCount(len) {
  document.getElementById('charCount').innerText = `${len} ${langData.char}`;
}

function setTheme(themeName) {
  document.body.className = '';
  if(currentLang === 'ar' || currentLang === 'fa' || currentLang === 'ur') document.body.classList.add('rtl');
  if(themeName !== 'light') document.body.classList.add('theme-' + themeName);
  localStorage.setItem('flowday_theme', themeName);
  
  document.querySelectorAll('.theme-dot').forEach(dot => {
    if(dot.getAttribute('data-theme') === themeName) {
      dot.classList.add('active');
    } else {
      dot.classList.remove('active');
    }
  });
}

window.addEventListener('scroll', () => {
  if (window.scrollY > 300) backToTopBtn.classList.add('show');
  else backToTopBtn.classList.remove('show');
});
backToTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

document.getElementById('noteContent').addEventListener('input', function() {
  updateCharCount(this.value.length);
});

function toggleSidebar(open) {
  const overlay = document.getElementById('sidebarOverlay');
  if(open) overlay.classList.add('active');
  else overlay.classList.remove('active');
}

function toggleSecretMode() {
  isSecretMode = !isSecretMode;
  const btn = document.getElementById('secretToggleBtn');
  if(isSecretMode) {
    btn.classList.add('active');
    triggerToast(langData.secure_activated);
  } else {
    btn.classList.remove('active');
    triggerToast(langData.secure_deactivated);
  }
}

function switchView(viewType) {
  if (viewType === 'secret' || viewType === 'trash') {
    openPinModal(() => { proceedSwitchView(viewType); });
  } else {
    proceedSwitchView(viewType);
  }
}

function proceedSwitchView(viewType) {
  currentView = viewType;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('emptyTrashBtn').style.display = (viewType === 'trash') ? 'block' : 'none';
  document.getElementById('mainEditorBox').style.display = (viewType === 'trash') ? 'none' : 'block';
  
  if(viewType === 'all') {
    document.getElementById('viewAll').classList.add('active');
    document.getElementById('currentViewTitle').innerText = langData.all_notes;
  } else if(viewType === 'fav') {
    document.getElementById('viewFav').classList.add('active');
    document.getElementById('currentViewTitle').innerText = langData.favs;
  } else if(viewType === 'secret') {
    document.getElementById('viewSecret').classList.add('active');
    document.getElementById('currentViewTitle').innerText = langData.secret_notes;
  } else if(viewType === 'trash') {
    document.getElementById('viewTrash').classList.add('active');
    document.getElementById('currentViewTitle').innerText = langData.trash_bin;
  } else {
    const folderEl = document.getElementById(`folder-${viewType}`);
    if(folderEl) folderEl.classList.add('active');
    document.getElementById('currentViewTitle').innerText = `${viewType} ${langData.coll}`;
  }
  toggleSidebar(false);
  renderNotes();
}

function openPinModal(successCallback) {
  currentPinDigits = "";
  onPinSuccessCallback = successCallback;
  
  window.customPin = localStorage.getItem('auraNotes_custom_pin') || "";
  if(window.customPin === "") {
    pinSetupMode = "SETUP";
  } else {
    pinSetupMode = "AUTH";
  }
  
  updatePinModalText();
  updatePinDots();
  document.getElementById('pinModal').classList.add('active');
}

function closePinModal() { 
  document.getElementById('pinModal').classList.remove('active'); 
}

function updatePinModalText() {
  const titleEl = document.getElementById('pinModalTitle');
  const descEl = document.getElementById('pinModalDesc');
  
  if(pinSetupMode === "SETUP") {
    titleEl.textContent = langData.setup_pin;
    descEl.textContent = langData.pin_setup_desc;
  } else if(pinSetupMode === "CONFIRM") {
    titleEl.textContent = langData.confirm_pin;
    descEl.textContent = langData.pin_confirm_desc;
  } else if(pinSetupMode === "RESET_AUTH") {
    titleEl.textContent = langData.change_pin_auth;
    descEl.textContent = langData.pin_reset_desc;
  } else {
    titleEl.textContent = langData.pin_title;
    descEl.textContent = langData.pin_desc;
  }
}

function pressPin(digit) {
  if (currentPinDigits.length < 4) {
    currentPinDigits += digit;
    updatePinDots();
  }
  if (currentPinDigits.length === 4) {
    setTimeout(() => { processPinValidation(); }, 150);
  }
}

function processPinValidation() {
  if (pinSetupMode === "SETUP") {
    tempNewPin = currentPinDigits;
    currentPinDigits = "";
    pinSetupMode = "CONFIRM";
    updatePinModalText();
    updatePinDots();
  } 
  else if (pinSetupMode === "CONFIRM") {
    if (currentPinDigits === tempNewPin) {
      localStorage.setItem('auraNotes_custom_pin', currentPinDigits);
      window.customPin = currentPinDigits;
      if (window.saveToFirebase) window.saveToFirebase(); 
      triggerToast(langData.pin_saved);
      pinSetupMode = "AUTH";
      closePinModal();
      if(onPinSuccessCallback) onPinSuccessCallback();
    } else {
      triggerToast(langData.pin_mismatch);
      currentPinDigits = "";
      pinSetupMode = "SETUP";
      updatePinModalText();
      updatePinDots();
    }
  } 
  else if (pinSetupMode === "RESET_AUTH") {
    if (currentPinDigits === window.customPin) {
      currentPinDigits = "";
      pinSetupMode = "SETUP";
      updatePinModalText();
      updatePinDots();
    } else {
      triggerToast(langData.pin_incorrect);
      currentPinDigits = "";
      updatePinDots();
    }
  }
  else {
    if (currentPinDigits === window.customPin) {
      triggerToast(langData.pin_success);
      closePinModal();
      if(onPinSuccessCallback) onPinSuccessCallback();
    } else {
      triggerToast(langData.pin_incorrect);
      currentPinDigits = "";
      updatePinDots();
    }
  }
}

function initiatePinReset() {
  currentPinDigits = "";
  updatePinDots();
  window.customPin = localStorage.getItem('auraNotes_custom_pin') || "";
  if (window.customPin === "") {
    pinSetupMode = "SETUP";
  } else {
    pinSetupMode = "RESET_AUTH";
  }
  updatePinModalText();
}

function clearPin() {
  currentPinDigits = currentPinDigits.slice(0, -1);
  updatePinDots();
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById(`dot-${i}`);
    if (i < currentPinDigits.length) dot.classList.add('filled');
    else dot.classList.remove('filled');
  }
}

function biometricAuth() {
  if (navigator.credentials && pinSetupMode === "AUTH") {
    triggerToast(langData.pin_success);
    closePinModal();
    if(onPinSuccessCallback) onPinSuccessCallback();
  } else {
    triggerToast(langData.bio_err);
  }
}

function createNewFolder() {
  const input = document.getElementById('newFolderInput');
  const name = input.value.trim();
  if(!name) return triggerToast(langData.blank_folder);
  if(window.folders.includes(name)) return triggerToast(langData.exist_folder);
  
  window.folders.push(name);
  input.value = '';
  saveState();
  renderFolders();
  triggerToast(langData.folder_success);
}

function removeFolder(folderName, event) {
  event.stopPropagation();
  if(protectedFolders.includes(folderName)) return triggerToast(langData.sys_folder_err);
  window.notes.forEach(note => { if(note.folder === folderName) note.folder = "Personal"; });
  window.folders = window.folders.filter(f => f !== folderName);
  if(currentView === folderName) currentView = 'all';
  saveState();
  renderFolders();
  renderNotes();
  triggerToast(langData.folder_del_success);
}

function addNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const content = document.getElementById('noteContent').value.trim();
  const folder = noteFolderSelect.value;

  if(!title && !content) return triggerToast(langData.empty_log);

  window.notes.unshift({
    id: Date.now(),
    title: title || langData.title_ph,
    content,
    folder,
    isFav: false,
    isSecret: isSecretMode,
    date: new Date().toLocaleDateString(currentLang, { month: 'short', day: 'numeric' })
  });

  document.getElementById('noteTitle').value = '';
  document.getElementById('noteContent').value = '';
  isSecretMode = false;
  document.getElementById('secretToggleBtn').classList.remove('active');
  updateCharCount(0);
  
  saveState();
  renderNotes();
  triggerToast(langData.save_success);
}

function toggleFav(id) {
  const note = window.notes.find(n => n.id === id);
  if(note) {
    note.isFav = !note.isFav;
    saveState();
    renderNotes();
    triggerToast(note.isFav ? langData.fav_add : langData.fav_rem);
  }
}

function deleteNoteToTrash(id) {
  const index = window.notes.findIndex(n => n.id === id);
  if (index !== -1) {
    window.trash.unshift(window.notes[index]);
    window.notes.splice(index, 1);
    saveState();
    renderNotes();
    triggerToast(langData.doc_del);
  }
}

function restoreNoteFromTrash(id) {
  const index = window.trash.findIndex(t => t.id === id);
  if (index !== -1) {
    window.notes.unshift(window.trash[index]);
    window.trash.splice(index, 1);
    saveState();
    renderNotes();
    triggerToast(langData.doc_restored);
  }
}

function hardDeleteFromTrash(id) {
  window.trash = window.trash.filter(t => t.id !== id);
  saveState();
  renderNotes();
}

function emptyTrashAll() {
  window.trash = [];
  saveState();
  renderNotes();
  triggerToast(langData.trash_empty);
}

function openEditModal(id) {
  const note = window.notes.find(n => n.id === id);
  if(!note) return;
  editingNoteId = id;
  document.getElementById('editTitle').value = note.title;
  document.getElementById('editContent').value = note.content;
  editFolderSelect.value = note.folder;
  document.getElementById('editModal').classList.add('active');
}

function saveEdit() {
  const note = window.notes.find(n => n.id === editingNoteId);
  if(note) {
    note.title = document.getElementById('editTitle').value.trim() || langData.title_ph;
    note.content = document.getElementById('editContent').value.trim();
    note.folder = editFolderSelect.value;
    saveState();
    renderNotes();
    closeModal();
    triggerToast(langData.doc_up);
  }
}

function closeModal() { document.getElementById('editModal').classList.remove('active'); }

function renderFolders() {
  foldersContainer.innerHTML = '';
  noteFolderSelect.innerHTML = '';
  editFolderSelect.innerHTML = '';

  window.folders.forEach(folder => {
    const isProtected = protectedFolders.includes(folder);
    
    const navItem = document.createElement('div');
    navItem.className = 'nav-item';
    navItem.id = `folder-${folder}`;
    navItem.onclick = () => switchView(folder);
    
    const navLeft = document.createElement('div');
    navLeft.className = 'nav-left';
    navLeft.innerHTML = `<i class='bx bx-folder main-icon'></i>`;
    
    const spanName = document.createElement('span');
    spanName.textContent = folder;
    navLeft.appendChild(spanName);
    navItem.appendChild(navLeft);
    
    if(!isProtected) {
      const delBtn = document.createElement('button');
      delBtn.className = 'remove-folder-btn';
      delBtn.innerHTML = `<i class='bx bx-trash-alt'></i>`;
      delBtn.onclick = (e) => removeFolder(folder, e);
      navItem.appendChild(delBtn);
    }
    
    foldersContainer.appendChild(navItem);

    const option1 = document.createElement('option');
    option1.value = folder;
    option1.textContent = folder;
    noteFolderSelect.appendChild(option1);

    const option2 = document.createElement('option');
    option2.value = folder;
    option2.textContent = folder;
    editFolderSelect.appendChild(option2);
  });
}

function renderNotes() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  notesGrid.innerHTML = '';
  
  if (currentView === 'trash') {
    let filteredTrash = window.trash.filter(t => t.title.toLowerCase().includes(query) || t.content.toLowerCase().includes(query));
    if(filteredTrash.length === 0) {
      notesGrid.innerHTML = `<div class="empty-state"><i class='bx bx-trash' style='font-size:2.5rem; color:var(--text-muted); display:block; margin-bottom:8px;'></i>${langData.empty}</div>`;
      return;
    }
    
    filteredTrash.forEach(note => {
      const card = document.createElement('div');
      card.className = 'note-card animate__animated animate__fadeInUp';
      
      const contentWrapper = document.createElement('div');
      const header = document.createElement('div');
      header.className = 'note-header';
      const h3 = document.createElement('h3');
      h3.className = 'note-title';
      h3.textContent = note.title;
      header.appendChild(h3);
      
      const p = document.createElement('p');
      p.className = 'note-body';
      p.textContent = note.content || langData.no_text;
      
      contentWrapper.appendChild(header);
      contentWrapper.appendChild(p);
      
      const footer = document.createElement('div');
      footer.className = 'note-footer';
      footer.innerHTML = `<span class="folder-badge"><i class='bx bx-trash'></i> ${langData.trash_badge}</span>`;
      
      const actions = document.createElement('div');
      actions.className = 'card-actions';
      
      const restoreBtn = document.createElement('button');
      restoreBtn.className = 'card-icon-btn';
      restoreBtn.innerHTML = `<i class='bx bx-undo'></i>`;
      restoreBtn.onclick = () => restoreNoteFromTrash(note.id);
      
      const hardDelBtn = document.createElement('button');
      hardDelBtn.className = 'card-icon-btn delete';
      hardDelBtn.innerHTML = `<i class='bx bx-x-circle'></i>`;
      hardDelBtn.onclick = () => hardDeleteFromTrash(note.id);
      
      actions.appendChild(restoreBtn);
      actions.appendChild(hardDelBtn);
      footer.appendChild(actions);
      
      card.appendChild(contentWrapper);
      card.appendChild(footer);
      notesGrid.appendChild(card);
    });
    return;
  }

  let filtered = window.notes;
  if (currentView === 'secret') {
    filtered = filtered.filter(n => n.isSecret);
  } else {
    filtered = filtered.filter(n => !n.isSecret);
    if(currentView === 'fav') filtered = filtered.filter(n => n.isFav);
    else if(currentView !== 'all') filtered = filtered.filter(n => n.folder === currentView);
  }

  if(query) {
    filtered = filtered.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));
  }

  if(filtered.length === 0) {
    notesGrid.innerHTML = `<div class="empty-state"><i class='bx bx-folder-open' style='font-size:2.5rem; color:var(--text-muted); display:block; margin-bottom:8px;'></i>${langData.empty}</div>`;
    return;
  }

  filtered.forEach(note => {
    const card = document.createElement('div');
    card.className = `note-card ${note.isFav ? 'favorite-style' : ''} animate__animated animate__fadeInUp`;
    
    const contentWrapper = document.createElement('div');
    const header = document.createElement('div');
    header.className = 'note-header';
    
    const h3 = document.createElement('h3');
    h3.className = 'note-title';
    h3.textContent = note.title;
    header.appendChild(h3);
    
    if(!note.isSecret) {
      const starBtn = document.createElement('button');
      starBtn.className = `star-btn ${note.isFav ? 'active' : ''}`;
      starBtn.innerHTML = `<i class='bx ${note.isFav ? 'bxs-star animate__animated animate__bounceIn' : 'bx-star'}'></i>`;
      starBtn.onclick = () => toggleFav(note.id);
      header.appendChild(starBtn);
    } else {
      header.innerHTML += `<i class='bx bx-lock' style='color:#EF4444; font-size:20px;'></i>`;
    }
    
    const p = document.createElement('p');
    p.className = 'note-body';
    p.textContent = note.content || langData.no_text;
    
    contentWrapper.appendChild(header);
    contentWrapper.appendChild(p);
    
    const footer = document.createElement('div');
    footer.className = 'note-footer';
    
    const badge = document.createElement('span');
    if(note.isSecret) {
      badge.className = 'folder-badge secret-badge';
      badge.innerHTML = `<i class='bx bx-lock-alt'></i> Secret`;
    } else {
      badge.className = 'folder-badge';
      badge.innerHTML = `<i class='bx bx-purchase-tag-alt'></i> ${note.folder}`;
    }
    footer.appendChild(badge);
    
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    
    const dateSpan = document.createElement('span');
    dateSpan.style.fontSize = '11px';
    dateSpan.style.color = 'var(--text-muted)';
    dateSpan.textContent = note.date;
    
    const editBtn = document.createElement('button');
    editBtn.className = 'card-icon-btn';
    editBtn.innerHTML = `<i class='bx bx-pencil'></i>`;
    editBtn.onclick = () => openEditModal(note.id);
    
    const delBtn = document.createElement('button');
    delBtn.className = 'card-icon-btn delete';
    delBtn.innerHTML = `<i class='bx bx-trash'></i>`;
    delBtn.onclick = () => deleteNoteToTrash(note.id);
    
    actions.appendChild(dateSpan);
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    footer.appendChild(actions);
    
    card.appendChild(contentWrapper);
    card.appendChild(footer);
    notesGrid.appendChild(card);
  });
}

function triggerToast(msg) {
  const toast = document.getElementById('toastBar');
  document.getElementById('toastMessage').innerText = msg;
  toast.classList.add('active');
  setTimeout(() => toast.classList.remove('active'), 2200);
}

window.saveState = function(shouldSyncFirebase = true) {
  localStorage.setItem('auraNotes_data', JSON.stringify(window.notes));
  localStorage.setItem('auraNotes_trash', JSON.stringify(window.trash));
  localStorage.setItem('auraNotes_folders', JSON.stringify(window.folders));
  
  if (shouldSyncFirebase && window.saveToFirebase) {
    window.saveToFirebase();
  }
}

// Global exposure for event handlers
window.toggleSidebar = toggleSidebar;
window.switchView = switchView;
window.createNewFolder = createNewFolder;
window.addNote = addNote;
window.pressPin = pressPin;
window.clearPin = clearPin;
window.biometricAuth = biometricAuth;
window.initiatePinReset = initiatePinReset;
window.closePinModal = closePinModal;
window.toggleSecretMode = toggleSecretMode;
window.changeLanguage = changeLanguage;
window.setTheme = setTheme;
window.emptyTrashAll = emptyTrashAll;
window.closeModal = closeModal;
window.saveEdit = saveEdit;
window.renderFolders = renderFolders;
window.renderNotes = renderNotes;

// Run initial configurations
applyLocalization();
renderFolders();
renderNotes();
</script>
</body>
</html>
