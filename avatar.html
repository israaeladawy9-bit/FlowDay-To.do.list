<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cute Animal Avatar Maker - FlowDay Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
:root {
    --purple-primary: #7B2CBF;
    --purple-light: #F3E8FF;
    --duo-green: #58CC02;
    --duo-green-dark: #46A302;
    --bg-creamy: #FAF6F0;
    --dark-text: #1F0833;
    --card-bg: rgba(255, 255, 255, 0.85);
    --border-color: #E5E5E5;
    --text-main: #2D1A3C;
}

body.theme-dark {
    --purple-primary: #9D4EDD;
    --purple-light: #241435;
    --bg-creamy: #120C1F;
    --dark-text: #F3E8FF;
    --card-bg: rgba(30, 22, 45, 0.85);
    --border-color: #3D2E4F;
    --text-main: #E2D9EC;
}

body.theme-pink {
    --purple-primary: #E11D48;
    --purple-light: #FFF1F2;
    --bg-creamy: #FFF1F2;
    --dark-text: #4C0519;
    --card-bg: rgba(255, 255, 255, 0.9);
    --border-color: #FFE4E6;
    --text-main: #4C0519;
}

body.theme-purple {
    --purple-primary: #8B5CF6;
    --purple-light: #F3E8FF;
    --bg-creamy: #FAF5FF;
    --dark-text: #3B0764;
    --card-bg: rgba(255, 255, 255, 0.9);
    --border-color: #F3E8FF;
    --text-main: #3B0764;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-creamy);
    transition: background 0.3s;
}

body {
    font-family: 'Outfit', 'Cairo', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    color: var(--text-main);
}

body.rtl {
    direction: rtl;
}

.art-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
}
.art-circle-1 {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255, 107, 157, 0.3) 0%, rgba(123, 44, 191, 0.15) 60%, transparent 100%);
    top: -15%;
    left: -20%;
    filter: blur(80px);
}
.art-circle-2 {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(88, 204, 2, 0.2) 0%, rgba(123, 44, 191, 0.1) 50%, transparent 100%);
    bottom: -10%;
    right: -25%;
    filter: blur(80px);
}

.app-container {
    background: var(--card-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    width: 100%;
    height: 100%;
    max-width: 430px;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 30px 60px rgba(123, 44, 191, 0.08);
}

.header-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 8px;
}

.controls-cluster {
    display: flex;
    gap: 6px;
}

.back-btn, .action-tool-btn {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-bottom: 4px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--purple-primary);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.1s;
    text-decoration: none;
}
.back-btn:active, .action-tool-btn:active {
    border-bottom-width: 2px;
    transform: translateY(2px);
}

.header-area h1 {
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--dark-text);
    letter-spacing: -0.5px;
}
.save-btn {
    padding: 10px 20px;
    border-radius: 16px;
    background: var(--duo-green);
    color: white;
    border: none;
    border-bottom: 4px solid var(--duo-green-dark);
    font-family: inherit;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.1s;
}
.save-btn:active {
    border-bottom-width: 2px;
    transform: translateY(2px);
}

.preview-box {
    width: 100%;
    height: 250px;
    background: linear-gradient(180deg, #FFF1E6 0%, #E8D8FF 100%);
    border-radius: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    border: 3px solid white;
    box-shadow: 0 16px 32px rgba(123, 44, 191, 0.1);
    overflow: hidden;
    position: relative;
}
.preview-box svg {
    width: 210px;
    height: 210px;
}

.snap-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 12px 0;
    margin-bottom: 8px;
}
.snap-tabs::-webkit-scrollbar { display: none; }
.tab-link {
    padding: 10px 16px;
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-bottom: 4px solid var(--border-color);
    border-radius: 16px;
    font-size: 12px;
    font-weight: 800;
    color: #777;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    gap: 6px;
}
body.theme-dark .tab-link { color: #A89CB8; }

.tab-link.active {
    background: var(--purple-light);
    color: var(--purple-primary);
    border-color: var(--purple-primary);
    border-bottom: 4px solid var(--purple-primary);
}

.editor-panel {
    flex: 1;
    overflow-y: auto;
    display: none;
}
.editor-panel.active {
    display: block;
}

.section-title {
    font-size: 11px;
    font-weight: 900;
    color: #A0A0A0;
    margin: 12px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.options-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.style-btn {
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-bottom: 4px solid var(--border-color);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.1s;
}
.style-btn:active {
    border-bottom-width: 2px;
    transform: translateY(2px);
}
.style-btn.active {
    background: var(--purple-primary);
    color: white;
    border-color: var(--purple-primary);
    border-bottom: 4px solid var(--purple-primary);
}

.color-picker {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.color-picker:hover {
    transform: scale(1.1);
}
.color-picker.active {
    transform: scale(1.15);
    border-color: var(--purple-primary);
    box-shadow: 0 0 0 3px rgba(123, 44, 191, 0.3);
}
</style>
</head>
<body>

<div class="art-bg">
    <div class="art-circle-1"></div>
    <div class="art-circle-2"></div>
</div>

<div class="app-container">
    <div class="header-area">
        <a href="main.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
        <h1 id="appTitle">Cute Animal Maker</h1>
        
        <div class="controls-cluster">
            <button class="action-tool-btn" onclick="toggleLanguage()"><i class="fa-solid fa-language"></i></button>
            <button class="action-tool-btn" onclick="nextTheme()"><i class="fa-solid fa-palette"></i></button>
            <button class="save-btn" id="saveAvatar">SAVE</button>
        </div>
    </div>

    <div class="preview-box" id="previewBox"></div>

    <div class="snap-tabs">
        <div class="tab-link active" data-target="tab-animal" id="tabLnkAnimal"><i class="fa-solid fa-paw"></i> <span>Animal</span></div>
        <div class="tab-link" data-target="tab-expression" id="tabLnkExpression"><i class="fa-solid fa-eye"></i> <span>Expressions</span></div>
        <div class="tab-link" data-target="tab-accessories" id="tabLnkAccessories"><i class="fa-solid fa-glasses"></i> <span>Accessories</span></div>
        <div class="tab-link" data-target="tab-style" id="tabLnkStyle"><i class="fa-solid fa-shirt"></i> <span>Style</span></div>
    </div>

    <div class="editor-panel active" id="tab-animal">
        <div class="section-title" id="titleSelectAnimal">Select Animal</div>
        <div class="options-group" id="animalTypes">
            <button class="style-btn active" data-val="bear" id="optBear">🐻 Bear</button>
            <button class="style-btn" data-val="cat" id="optCat">🐱 Cat</button>
            <button class="style-btn" data-val="rabbit" id="optRabbit">🐰 Rabbit</button>
            <button class="style-btn" data-val="fox" id="optFox">🦊 Fox</button>
        </div>

        <div class="section-title" id="titleFurColor">Fur Color</div>
        <div class="options-group" id="furColors">
            <div class="color-picker active" style="background: #CD7F32;" data-val="CD7F32"></div>
            <div class="color-picker" style="background: #8B5A2B;" data-val="8B5A2B"></div>
            <div class="color-picker" style="background: #E5E5E5;" data-val="E5E5E5"></div>
            <div class="color-picker" style="background: #FF9F43;" data-val="FF9F43"></div>
            <div class="color-picker" style="background: #4A4A4A;" data-val="4A4A4A"></div>
        </div>
    </div>

    <div class="editor-panel" id="tab-expression">
        <div class="section-title" id="titleEyesStyle">Eyes Style</div>
        <div class="options-group" id="eyeStyles">
            <button class="style-btn active" data-val="open" id="optEyeOpen">Happy Shiny</button>
            <button class="style-btn" data-val="cute" id="optEyeCute">Anime Cute</button>
            <button class="style-btn" data-val="wink" id="optEyeWink">Wink</button>
            <button class="style-btn" data-val="sleeping" id="optEyeSleep">Closed</button>
        </div>

        <div class="section-title" id="titleMouthStyle">Mouth & Smile</div>
        <div class="options-group" id="mouthStyles">
            <button class="style-btn active" data-val="smile" id="optMouthSmile">Cute Smile</button>
            <button class="style-btn" data-val="laugh" id="optMouthLaugh">Open Laugh</button>
            <button class="style-btn" data-val="tongue" id="optMouthTongue">Playful Tongue</button>
        </div>
    </div>

    <div class="editor-panel" id="tab-accessories">
        <div class="section-title" id="titleGlasses">Glasses</div>
        <div class="options-group" id="glassesStyles">
            <button class="style-btn active" data-val="none" id="optGlassNone">None</button>
            <button class="style-btn" data-val="round" id="optGlassRound">Round Glasses</button>
            <button class="style-btn" data-val="square" id="optGlassSquare">Square Glasses</button>
            <button class="style-btn" data-val="cool" id="optGlassCool">Cool Shades</button>
        </div>

        <div class="section-title" id="titleMustache">Gentleman Mustache</div>
        <div class="options-group" id="mustacheStyles">
            <button class="style-btn active" data-val="none" id="optMustacheNone">None</button>
            <button class="style-btn" data-val="classic" id="optMustacheClassic">Classic Mustache</button>
            <button class="style-btn" data-val="gentle" id="optMustacheGentle">Curled Mustache</button>
            <button class="style-btn" data-val="beard" id="optMustacheBeard">French Beard</button>
        </div>
    </div>

    <div class="editor-panel" id="tab-style">
        <div class="section-title" id="titleClothing">Clothing Style</div>
        <div class="options-group" id="clothingStyles">
            <button class="style-btn active" data-val="shirt" id="optClothShirt">Bowtie Shirt</button>
            <button class="style-btn" data-val="hoodie" id="optClothHoodie">Cozy Hoodie</button>
            <button class="style-btn" data-val="scarf" id="optClothScarf">Winter Scarf</button>
        </div>

        <div class="section-title" id="titleClothColor">Clothing Color</div>
        <div class="options-group" id="clothingColors">
            <div class="color-picker active" style="background: #7b2cbf;" data-val="7b2cbf"></div>
            <div class="color-picker" style="background: #ff6b9d;" data-val="ff6b9d"></div>
            <div class="color-picker" style="background: #2196f3;" data-val="2196f3"></div>
            <div class="color-picker" style="background: #4caf50;" data-val="4caf50"></div>
            <div class="color-picker" style="background: #ff9800;" data-val="ff9800"></div>
        </div>
    </div>
</div>

<script>

let currentLang = localStorage.getItem('flowday_app_lang') || 'en';
let currentTheme = localStorage.getItem('flowday_theme') || 'light';

window.addEventListener('DOMContentLoaded', () => {
    applyTheme(currentTheme);
    applyLanguage(currentLang);
    updateAvatarPreview(false);
});

const layoutThemes = ['light', 'dark', 'pink', 'purple'];
function nextTheme() {
    let index = layoutThemes.indexOf(currentTheme);
    index = (index + 1) % layoutThemes.length;
    currentTheme = layoutThemes[index];
    localStorage.setItem('flowday_theme', currentTheme);
    applyTheme(currentTheme);
}

function applyTheme(theme) {
    document.body.className = '';
    if (theme !== 'light') {
        document.body.classList.add('theme-' + theme);
    }
}

function toggleLanguage() {
    const codes = Object.keys(dictionary);
    let idx = codes.indexOf(currentLang);
    idx = (idx + 1) % codes.length;
    currentLang = codes[idx];
    localStorage.setItem('flowday_app_lang', currentLang);
    applyLanguage(currentLang);
}

function applyLanguage(lang) {
    const dict = dictionary[lang];
    if (lang === 'ar') {
        document.body.classList.add('rtl');
    } else {
        document.body.classList.remove('rtl');
    }
    
    document.getElementById('appTitle').innerText = dict.title;
    document.getElementById('saveAvatar').innerText = dict.save;
    
    document.querySelector('#tabLnkAnimal span').innerText = dict.tabAnimal;
    document.querySelector('#tabLnkExpression span').innerText = dict.tabExpression;
    document.querySelector('#tabLnkAccessories span').innerText = dict.tabAccessories;
    document.querySelector('#tabLnkStyle span').innerText = dict.tabStyle;
    
    document.getElementById('titleSelectAnimal').innerText = dict.secAnimal;
    document.getElementById('titleFurColor').innerText = dict.secFur;
    document.getElementById('titleEyesStyle').innerText = dict.secEyes;
    document.getElementById('titleMouthStyle').innerText = dict.secMouth;
    document.getElementById('titleGlasses').innerText = dict.secGlass;
    document.getElementById('titleMustache').innerText = dict.secMustache;
    document.getElementById('titleClothing').innerText = dict.secCloth;
    document.getElementById('titleClothColor').innerText = dict.secClothClr;
    
    document.getElementById('optBear').innerText = dict.bear;
    document.getElementById('optCat').innerText = dict.cat;
    document.getElementById('optRabbit').innerText = dict.rabbit;
    document.getElementById('optFox').innerText = dict.fox;
    
    document.getElementById('optEyeOpen').innerText = dict.eyeOpen;
    document.getElementById('optEyeCute').innerText = dict.eyeCute;
    document.getElementById('optEyeWink').innerText = dict.eyeWink;
    document.getElementById('optEyeSleep').innerText = dict.eyeSleep;
    
    document.getElementById('optMouthSmile').innerText = dict.mthSmile;
    document.getElementById('optMouthLaugh').innerText = dict.mthLaugh;
    document.getElementById('optMouthTongue').innerText = dict.mthTongue;
    
    document.getElementById('optGlassNone').innerText = dict.glsNone;
    document.getElementById('optGlassRound').innerText = dict.glsRound;
    document.getElementById('optGlassSquare').innerText = dict.glsSquare;
    document.getElementById('optGlassCool').innerText = dict.glsCool;
    
    document.getElementById('optMustacheNone').innerText = dict.mstNone;
    document.getElementById('optMustacheClassic').innerText = dict.mstClassic;
    document.getElementById('optMustacheGentle').innerText = dict.mstGentle;
    document.getElementById('optMustacheBeard').innerText = dict.mstBeard;
    
    document.getElementById('optClothShirt').innerText = dict.cloShirt;
    document.getElementById('optClothHoodie').innerText = dict.cloHoodie;
    document.getElementById('optClothScarf').innerText = dict.cloScarf;
}

function getDarkerColor(hex) {
    let num = parseInt(hex, 16);
    let r = (num >> 16) - 35;
    let g = ((num >> 8) & 0x00ff) - 35;
    let b = (num & 0x0000ff) - 35;
    return `#${((1 << 24) + ((r < 0 ? 0 : r) << 16) + ((g < 0 ? 0 : g) << 8) + (b < 0 ? 0 : b)).toString(16).slice(1)}`;
}

function generateAnimalAvatar() {
    const furMain = `#${config.furColor}`;
    const furDark = getDarkerColor(config.furColor);
    const clothMain = `#${config.clothingColor}`;
    const clothDark = getDarkerColor(config.clothingColor);

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="--fur-color:${furMain}; --fur-dark:${furDark}; --cloth-color:${clothMain}; --cloth-dark:${clothDark}; width:100%; height:100%;">
        ${AnimalLibrary.defs}
        <g id="layer-animal">${AnimalLibrary.animals[config.animal]()}</g>
        <g id="layer-expressions">${AnimalLibrary.eyes[config.eyes]()}${AnimalLibrary.mouth[config.mouth]()}</g>
        <g id="layer-mustache">${AnimalLibrary.mustache[config.mustache]()}</g>
        <g id="layer-glasses">${AnimalLibrary.glasses[config.glasses]()}</g>
        <g id="layer-clothing">${AnimalLibrary.clothing[config.clothing]()}</g>
    </svg>`;
}

function updateAvatarPreview(isAnimated = false) {
    const previewBox = document.getElementById('previewBox');
    previewBox.innerHTML = generateAnimalAvatar();

    if (isAnimated) {
        gsap.fromTo("#previewBox svg", 
            { scale: 0.85, rotate: -4 }, 
            { scale: 1, rotate: 0, duration: 0.4, ease: "elastic.out(1, 0.5)" }
        );
    }
}

document.querySelectorAll('.tab-link').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.editor-panel').forEach(p => p.classList.remove('active'));
        
        tab.classList.add('active');
        const target = tab.getAttribute('data-target');
        document.getElementById(target).classList.add('active');
        
        gsap.fromTo(`#${target}`, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25 });
    });
});

function setupGroupListener(groupId, configKey, isColor = false) {
    document.getElementById(groupId).addEventListener('click', (e) => {
        const targetClass = isColor ? 'color-picker' : 'style-btn';
        if (e.target.classList.contains(targetClass)) {
            document.querySelectorAll(`#${groupId} .${targetClass}`).forEach(el => el.classList.remove('active'));
            e.target.classList.add('active');
            
            config[configKey] = e.target.getAttribute('data-val');
            updateAvatarPreview(true);
        }
    });
}

setupGroupListener('animalTypes', 'animal', false);
setupGroupListener('furColors', 'furColor', true);
setupGroupListener('eyeStyles', 'eyes', false);
setupGroupListener('mouthStyles', 'mouth', false);
setupGroupListener('mustacheStyles', 'mustache', false);
setupGroupListener('glassesStyles', 'glasses', false);
setupGroupListener('clothingStyles', 'clothing', false);
setupGroupListener('clothingColors', 'clothingColor', true);

document.getElementById('saveAvatar').addEventListener('click', () => {
    const svgElement = document.getElementById('previewBox').querySelector('svg');
    const svgString = new XMLSerializer().serializeToString(svgElement);
    localStorage.setItem('customVectorAvatar', svgString);
    
    gsap.to(".app-container", { scale: 0.95, opacity: 0, duration: 0.2, onComplete: () => {
        window.location.href = 'main.html';
    }});
});
