        :root {
            --bg-base: #F9FAFC;
            --container-bg: rgba(255, 255, 255, 0.85);
            --card-bg: #FFFFFF;
            --text-main: #1E1B4B; 
            --text-muted: #6B7280;
            --main-purple: #8B5CF6;
            --main-pink: #F43F5E;
            --border-color: #EAE6EE;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --track-color: #EAE6EE;
            --gradient-start: #F43F5E;
            --gradient-mid: #8B5CF6;
            --gradient-end: #C084FC;
        }

        /* الثيم الداكن الأساسي (Dark Mode) */
        body.theme-dark {
            --bg-base: #0B0F19;
            --container-bg: rgba(17, 24, 39, 0.85);
            --card-bg: #1F2937;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: #374151;
            --nav-bg: rgba(31, 41, 55, 0.85);
            --track-color: #374151;
        }

        /* ثيم أسود فخم (Black Mode) */
        body.theme-black {
            --bg-base: #050505;
            --container-bg: rgba(15, 15, 15, 0.9);
            --card-bg: #121212;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --main-purple: #E2E8F0;
            --border-color: #222222;
            --nav-bg: rgba(20, 20, 20, 0.9);
            --track-color: #222222;
            --gradient-start: #ffffff;
            --gradient-mid: #a1a1aa;
            --gradient-end: #3f3f46;
        }

        /* ثيم بني (Brown Mode) */
        body.theme-brown {
            --bg-base: #FDF8F5;
            --container-bg: rgba(253, 248, 245, 0.85);
            --card-bg: #FFFFFF;
            --text-main: #451A03;
            --text-muted: #78350F;
            --main-purple: #B45309;
            --border-color: #FED7AA;
            --track-color: #FED7AA;
            --gradient-start: #78350F;
            --gradient-mid: #D97706;
            --gradient-end: #FCD34D;
        }

        /* ثيم أخضر (Green Mode) */
        body.theme-green {
            --bg-base: #F0FDF4;
            --container-bg: rgba(240, 253, 244, 0.85);
            --card-bg: #FFFFFF;
            --text-main: #14532D;
            --text-muted: #166534;
            --main-purple: #15803D;
            --border-color: #BBF7D0;
            --track-color: #BBF7D0;
            --gradient-start: #166534;
            --gradient-mid: #22C55E;
            --gradient-end: #86EFAC;
        }

        /* ثيم أصفر (Yellow Mode) */
        body.theme-yellow {
            --bg-base: #FEFCE8;
            --container-bg: rgba(254, 252, 232, 0.85);
            --card-bg: #FFFFFF;
            --text-main: #713F12;
            --text-muted: #854D0E;
            --main-purple: #A16207;
            --border-color: #FEF08A;
            --track-color: #FEF08A;
            --gradient-start: #854D0E;
            --gradient-mid: #EAB308;
            --gradient-end: #FEF08A;
        }

        /* ثيم بمبي / وردي (Pink Mode) */
        body.theme-pink {
            --bg-base: #FFF1F2;
            --container-bg: rgba(255, 241, 242, 0.85);
            --card-bg: #FFFFFF;
            --text-main: #4C0519;
            --text-muted: #9F1239;
            --main-purple: #F43F5E;
            --border-color: #FFE4E6;
            --track-color: #FFE4E6;
            --gradient-start: #9F1239;
            --gradient-mid: #FB7185;
            --gradient-end: #FECDD3;
        }

        /* ثيم بنفسجي (Purple Mode) */
        body.theme-purple {
            --bg-base: #FAF5FF;
            --container-bg: rgba(250, 245, 255, 0.85);
            --card-bg: #FFFFFF;
            --text-main: #3B0764;
            --text-muted: #701A75;
            --main-purple: #8B5CF6;
            --border-color: #F3E8FF;
            --track-color: #F3E8FF;
            --gradient-start: #701A75;
            --gradient-mid: #A855F7;
            --gradient-end: #E9D5FF;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html, body { height: 100%; overflow: hidden; background: var(--bg-base); }
        body {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif; display: flex;
            justify-content: center; align-items: center; color: var(--text-main); position: relative;
        }

        /* دعم لغات الـ RTL */
        body.rtl { direction: rtl; }
        body.rtl .back-btn i { transform: rotate(180deg); }

        .art-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; overflow: hidden;
        }
        .art-circle-1 {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
            top: -10%; left: -10%; filter: blur(60px);
        }
        .art-circle-2 {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.1) 0%, transparent 70%);
            bottom: -10%; right: -10%; filter: blur(60px);
        }

        .app-container {
            width: 100%; height: 100%; max-width: 430px;
            background: var(--container-bg); backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px; padding: 50px 24px 110px; display: flex; flex-direction: column;
            box-shadow: 0 40px 80px rgba(139, 92, 246, 0.06); z-index: 1; position: relative;
        }

        .header-navigation { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .back-btn {
            display: flex; align-items: center; gap: 6px; background: rgba(139, 92, 246, 0.08);
            color: var(--main-purple); border: none; padding: 8px 14px; border-radius: 12px;
            font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.3s ease;
        }
        .back-btn:hover { background: var(--main-purple); color: white; }
        h1 { font-size: 1.35rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }

        .analytics-box {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        }

        .circular-progress-wrapper {
            position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center;
        }

        svg.progress-ring {
            transform: rotate(-90deg); width: 220px; height: 220px;
        }
        svg.progress-ring circle {
            stroke-width: 14; fill: transparent; stroke-linecap: round;
        }
        svg.progress-ring .track {
            stroke: var(--track-color);
        }
        svg.progress-ring .fill {
            stroke: url(#auroraGradient);
            stroke-dasharray: 615.75; 
            stroke-dashoffset: 615.75; 
            transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-content {
            position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .percentage-num {
            font-size: 40px; font-weight: 900; color: var(--text-main); letter-spacing: -1px; line-height: 1;
        }
        .percentage-label {
            font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 6px; letter-spacing: 0.5px;
        }

        .status-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px;
            width: 100%; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.02);
        }
        .status-info-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .status-info-sub { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
        .status-count { font-size: 18px; font-weight: 800; color: var(--main-purple); }

        .nav-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 0 24px 30px; z-index: 10;
        }
        .bottom-nav {
            background: var(--nav-bg); border: 1px solid var(--border-color);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); height: 72px; border-radius: 24px;
            display: flex; justify-content: space-around; align-items: center; padding: 0 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
        }
        .nav-item {
            display: flex; align-items: center; justify-content: center; text-decoration: none; color: #9CA3AF;
            width: 48px; height: 48px; border-radius: 14px; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .nav-icon { font-size: 19px; }
        .nav-item.active {
            color: var(--main-purple); background: rgba(139, 92, 246, 0.08);
        }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--main-purple);
        }
        .nav-item:hover:not(.active) {
            color: var(--text-main); background: rgba(139, 92, 246, 0.05);
        }

        /* نافذة سؤال الإتمام التلقائية (Modal) */
        .notification-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 27, 75, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px;
            visibility: hidden; opacity: 0; transition: all 0.3s ease;
        }
        .notification-modal.active { visibility: visible; opacity: 1; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 24px; width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .modal-icon { width: 55px; height: 55px; background: rgba(139, 92, 246, 0.08); color: var(--main-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 22px; }
        .modal-box h3 { font-size: 16px; color: var(--text-main); font-weight: 800; }
        .modal-box p { font-size: 13px; color: var(--text-muted); }
        .modal-actions { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
        .modal-btn.confirm { background: #58CC02; color: white; }
        .modal-btn.half { background: #F59E0B; color: white; }
        .modal-btn.cancel { background: #EF4444; color: white; }
    </style>
</head>

    <div class="art-circle-2"></div>
</div>

<div class="app-container animate__animated animate__fadeIn">
    
    <div class="header-navigation">
        <a href="main.html" class="back-btn">

        <h1 data-key="page_title">Day Productivity</h1>

    <div class="analytics-box">
        <div class="circular-progress-wrapper">
            <svg class="progress-ring" viewBox="0 0 210 210">
                <defs>
                    <linearGradient id="auroraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" id="gradStart" stop-color="var(--gradient-start)" />
                        <stop offset="60%" id="gradMid" stop-color="var(--gradient-mid)" />
                        <stop offset="100%" id="gradEnd" stop-color="var(--gradient-end)" />
                    </linearGradient>
                </defs>
                <circle class="track" cx="105" cy="105" r="98" />
                <circle class="fill" id="glowCircle" cx="105" cy="105" r="98" />
            </svg>
            
            <div class="progress-content">
                <span class="percentage-num" id="percentText">0%</span>
                <span class="percentage-label" data-key="completed_label">Completed</span>
            </div>
        </div>

        <div class="status-card">
            <div>
                <div class="status-info-title" id="statusMainTitle">Starting From Zero</div>
                <div class="status-info-sub" id="statusSubTitle">Complete your scheduled tasks to progress.</div>
            </div>
            <div class="status-count" id="taskRatio">0/0</div>
        </div>
    </div>

    <div class="nav-wrapper">
        <div class="bottom-nav">
            <a href="main.html" class="nav-item">

            <a href="maketable.html" class="nav-item active">

            <a href="achieve.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-trophy"></i></span>
            </a>
            <a href="brofile.html" class="nav-item">
                <span class="nav-icon"><i class="fa-regular fa-circle-user"></i></span>
            </a>
            <a href="sting.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
            </a>
        </div>
    </div>
</div>

<div class="notification-modal" id="checkInModal">
    <div class="modal-box">
        <div class="modal-icon"><i class="fa-regular fa-bell"></i></div>
        <h3 id="modalTaskTitle" data-key="modal_task_title">Task Status</h3>
        <p id="modalTaskTime" data-key="modal_task_time">Did you complete this task?</p>
        <div class="modal-actions">
            <button class="modal-btn confirm" onclick="closeModal('yes')" data-key="btn_yes">Yes</button>
            <button class="modal-btn half" onclick="closeModal('50%')" data-key="btn_50">50%</button>
            <button class="modal-btn cancel" onclick="closeModal('no')" data-key="btn_no">No</button>
        </div>
    </div>
</div>

    let globalTasks = [];
    let currentLang = 'en';

    document.addEventListener("DOMContentLoaded", () => {
        // 1. استعادة وتطبيق اللغة المحفوظة (أو افتراضياً الإنجليزية)
        currentLang = localStorage.getItem('flowday_app_lang') || 'en';
        translatePage(currentLang);

        // 2. استعادة وتطبيق الثيم المحفوظ (أو افتراضياً الفاتح)
        const savedTheme = localStorage.getItem('flowday_theme') || 'light';
        setTheme(savedTheme);

        calculatePerformance();
        startClockSyncTracker();
    });

    function translatePage(lang) {
        if (lang === 'ar' || lang === 'fa') {
            document.body.classList.add('rtl');
        } else {
            document.body.classList.remove('rtl');
        }

        document.querySelectorAll('[data-key]').forEach(element => {
            const key = element.getAttribute('data-key');
            if (dictionary[lang] && dictionary[lang][key]) {
                element.innerText = dictionary[lang][key];
            }
        });
    }

    function setTheme(theme) {
        document.body.className = ''; 
        if (currentLang === 'ar' || currentLang === 'fa') document.body.classList.add('rtl');
        if (theme !== 'light') {
            document.body.classList.add('theme-' + theme);
        }
    }

    function calculatePerformance() {
        globalTasks = JSON.parse(localStorage.getItem('smartUserTasks')) || 
                      JSON.parse(localStorage.getItem('userTasks')) || 
                      JSON.parse(localStorage.getItem('tasks')) || [];
        
        const dynamicTasks = globalTasks.filter(t => !t.isFixed);
        const totalCount = dynamicTasks.length;

        let finishedCount = 0;

        dynamicTasks.forEach(t => {
            if (t.completed === true || t.checked === true || t.status === 'completed' || t.status === 'done') {
                finishedCount += 1;
            } else if (t.name && (t.name.includes('(50% Done)') || t.name.includes('نصف مكتمل') || t.name.includes('۵۰٪'))) {
                finishedCount += 0.5;
            }
        });

        let completionPercentage = 0;
        if (totalCount > 0) {
            completionPercentage = Math.round((finishedCount / totalCount) * 100);
            if (completionPercentage < 0) completionPercentage = 0;
            if (completionPercentage > 100) completionPercentage = 100;
        }

        document.getElementById('percentText').innerText = `${completionPercentage}%`;
        document.getElementById('taskRatio').innerText = `${Math.floor(finishedCount)}/${totalCount}`;

        const circle = document.getElementById('glowCircle');
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius; 
        
        circle.style.strokeDashoffset = circumference - (completionPercentage / 100) * circumference;

        const mainTitle = document.getElementById('statusMainTitle');
        const subTitle = document.getElementById('statusSubTitle');

        const dict = dictionary[currentLang] || dictionary['en'];

        if (totalCount === 0) {
            mainTitle.innerText = dict.no_tasks_title;
            subTitle.innerText = dict.no_tasks_sub;
        } else if (completionPercentage === 100) {
            mainTitle.innerText = dict.elite_title;
            subTitle.innerText = dict.elite_sub;
        } else if (completionPercentage >= 50) {
            mainTitle.innerText = dict.great_title;
            subTitle.innerText = dict.great_sub;
        } else if (completionPercentage > 0) {
            mainTitle.innerText = dict.ongoing_title;
            subTitle.innerText = dict.ongoing_sub;
        } else {
            mainTitle.innerText = dict.zero_title;
            subTitle.innerText = dict.zero_sub;
        }
    }

    function startClockSyncTracker() {
        setInterval(() => {
            const now = new Date();
            const currentDeviceMinute = (now.getHours() * 60) + now.getMinutes();
            const seconds = now.getSeconds();

            if (seconds === 0) {
                globalTasks.forEach(task => {
                    if (!task.isOverflow && !task.isFixed) {
                        if (task.calculatedEndMinute === currentDeviceMinute && !task.prompted) {
                            task.prompted = true; 
                            localStorage.setItem('smartUserTasks', JSON.stringify(globalTasks));
                            triggerCheckIn(task.id, task.name);
                        }
                    }
                });
            }
        }, 1000);
    }

    let currentActiveCheckInId = null;
    function triggerCheckIn(id, name) {
        currentActiveCheckInId = id;
        const dict = dictionary[currentLang] || dictionary['en'];
        
        if (currentLang === 'ar' || currentLang === 'fa') {
            document.getElementById('modalTaskTitle').innerText = `${dict.modal_ask} "${name}"؟`;
        } else if (['ja', 'ko', 'zh'].includes(currentLang)) {
            document.getElementById('modalTaskTitle').innerText = `"${name}" ${dict.modal_ask}?`;
        } else {
            document.getElementById('modalTaskTitle').innerText = `${dict.modal_ask} "${name}"?`;
        }
        
        document.getElementById('checkInModal').classList.add('active');
    }

    function closeModal(status) {
        document.getElementById('checkInModal').classList.remove('active');
        if (currentActiveCheckInId) {
            let task = globalTasks.find(t => t.id === currentActiveCheckInId);
            if (task) {
                if (status === 'yes') {
                    task.completed = true;
                } else if (status === '50%') {
                    let mark = " (50% Done)";
                    if (currentLang === 'ar') mark = " (نصف مكتمل)";
                    if (currentLang === 'fa') mark = " (۵۰٪ انجام شده)";
                    
                    if (!task.name.includes(mark)) {
                        task.name += mark;
                    }
                    task.completed = false;
                } else {
                    task.completed = false;
                }
            }
            localStorage.setItem('smartUserTasks', JSON.stringify(globalTasks));
            calculatePerformance();
        }
        currentActiveCheckInId = null;
    }
